<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Gold metallic ring gradient -->
    <linearGradient id="goldRing" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="25%"  stop-color="#D4A017"/>
      <stop offset="55%"  stop-color="#F0C040"/>
      <stop offset="80%"  stop-color="#A87000"/>
      <stop offset="100%" stop-color="#C9920A"/>
    </linearGradient>
    <!-- Gold slash gradient -->
    <linearGradient id="goldSlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="40%"  stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#A87000"/>
    </linearGradient>
    <!-- White briefs gradient – 3D shading -->
    <linearGradient id="briefsGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="40%"  stop-color="#F5F5F5"/>
      <stop offset="80%"  stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#C8C8C8"/>
    </linearGradient>
    <!-- Shadow under briefs -->
    <linearGradient id="briefsShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="goldGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Clip interior of circle -->
    <clipPath id="circleInterior">
      <circle cx="250" cy="250" r="190"/>
    </clipPath>
  </defs>

  <!-- BLACK BACKGROUND -->
  <rect width="500" height="500" fill="#000000"/>

  <!-- === BRIEFS (white, inside circle, clipped) === -->
  <g clip-path="url(#circleInterior)">
    <!-- Main briefs body -->
    <path d="
      M 118,248
      C 120,210  158,185  205,180
      C 222,178  236,177  250,177
      C 264,177  278,178  295,180
      C 342,185  380,210  382,248
      C 364,268  344,283  320,295
      C 296,308  272,318  260,323
      C 255,325  252,326  250,326
      C 248,326  245,325  240,323
      C 228,318  204,308  180,295
      C 156,283  136,268  118,248
      Z"
      fill="url(#briefsGrad)"
      stroke="rgba(180,180,180,0.3)"
      stroke-width="0.8"/>

    <!-- Waistband top highlight -->
    <path d="
      M 125,247
      C 130,222  165,205  208,200
      C 225,198  238,197  250,197
      C 262,197  275,198  292,200
      C 335,205  370,222  375,247"
      fill="none"
      stroke="rgba(255,255,255,0.9)"
      stroke-width="14"
      stroke-linecap="round"
      opacity="0.6"/>

    <!-- Center fold highlight -->
    <path d="M 250,197 L 250,326" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>

    <!-- Inner shadow on left leg -->
    <path d="
      M 118,248
      C 130,258  148,272  170,282
      C 190,292  215,305  238,317"
      fill="none"
      stroke="rgba(0,0,0,0.12)"
      stroke-width="10"
      stroke-linecap="round"/>

    <!-- Inner shadow on right leg -->
    <path d="
      M 382,248
      C 370,258  352,272  330,282
      C 310,292  285,305  262,317"
      fill="none"
      stroke="rgba(0,0,0,0.12)"
      stroke-width="10"
      stroke-linecap="round"/>
  </g>

  <!-- === GOLD OUTER RING === -->
  <!-- Shadow ring -->
  <circle cx="253" cy="254" r="196" fill="none"
    stroke="rgba(80,40,0,0.5)" stroke-width="30"/>
  <!-- Main ring -->
  <circle cx="250" cy="250" r="196" fill="none"
    stroke="url(#goldRing)" stroke-width="26"
    filter="url(#goldGlow)"/>
  <!-- Inner ring edge highlight -->
  <circle cx="250" cy="250" r="184" fill="none"
    stroke="rgba(255,230,100,0.25)" stroke-width="2"/>
  <!-- Outer ring edge shadow -->
  <circle cx="250" cy="250" r="209" fill="none"
    stroke="rgba(80,40,0,0.2)" stroke-width="2"/>

  <!-- === GOLD DIAGONAL SLASH (upper-left → lower-right) === -->
  <!-- Slash shadow -->
  <line x1="108" y1="108" x2="394" y2="394"
    stroke="rgba(80,40,0,0.45)" stroke-width="32"
    stroke-linecap="round"/>
  <!-- Main slash -->
  <line x1="108" y1="108" x2="394" y2="394"
    stroke="url(#goldSlash)" stroke-width="26"
    stroke-linecap="round"
    filter="url(#goldGlow)"/>
  <!-- Slash highlight -->
  <line x1="109" y1="107" x2="392" y2="391"
    stroke="rgba(255,235,100,0.35)" stroke-width="8"
    stroke-linecap="round"/>
</svg>
