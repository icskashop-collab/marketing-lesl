<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Gold gradient for metallic effect -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F5D060"/>
      <stop offset="35%"  stop-color="#D4A017"/>
      <stop offset="65%"  stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldSlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F5D060"/>
      <stop offset="50%"  stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#C49010"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Clip to circle interior -->
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="192"/>
    </clipPath>
  </defs>

  <!-- Underwear/briefs shape — dark inside circle -->
  <g clip-path="url(#circleClip)">
    <!-- Main underwear body -->
    <path d="
      M 128,240
      C 128,205 158,188 200,183
      C 220,181 236,180 250,180
      C 264,180 280,181 300,183
      C 342,188 372,205 372,240
      C 355,258 338,272 316,285
      C 294,298 272,308 260,314
      C 255,316 252,317 250,317
      C 248,317 245,316 240,314
      C 228,308 206,298 184,285
      C 162,272 145,258 128,240
      Z"
      fill="#0D0D0D"
      stroke="rgba(212,160,23,0.3)"
      stroke-width="1.5"/>
    <!-- Waistband highlight -->
    <path d="
      M 140,240
      C 145,222 175,210 210,205
      C 226,203 238,202 250,202
      C 262,202 274,203 290,205
      C 325,210 355,222 360,240"
      fill="none"
      stroke="rgba(212,160,23,0.15)"
      stroke-width="12"
      stroke-linecap="round"/>
  </g>

  <!-- Gold ring (outer circle stroke) with glow -->
  <circle cx="250" cy="250" r="196"
    fill="none"
    stroke="url(#goldRing)"
    stroke-width="26"
    filter="url(#glow)"/>

  <!-- Gold diagonal slash (\) — upper-left to lower-right -->
  <line x1="108" y1="106" x2="393" y2="394"
    stroke="url(#goldSlash)"
    stroke-width="28"
    stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- Subtle inner ring edge highlight -->
  <circle cx="250" cy="250" r="183"
    fill="none"
    stroke="rgba(245,208,96,0.12)"
    stroke-width="2"/>
  <circle cx="250" cy="250" r="209"
    fill="none"
    stroke="rgba(245,208,96,0.08)"
    stroke-width="2"/>
</svg>
